<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Usuarios')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div class="page-head"><div><span class="eyebrow dark">SEGURIDAD</span><h1>Usuarios y roles</h1><p>Solo el administrador puede crear nuevas cuentas de acceso.</p></div></div><div class="grid-2"><div class="panel"><h3>Crear usuario</h3><form th:action="@{/users/save}" method="post" class="stack"><label>Nombres<input name="nombres" required></label><label>Usuario<input name="username" required></label><label>Contraseña<input type="password" name="password" required minlength="8"></label><label>Rol<select name="role" required><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select></label><button class="btn primary" type="submit">Crear cuenta</button></form></div><div class="panel"><h3>Cuentas activas</h3><div class="mini-list"><div class="mini-item" th:each="u:${users}"><b th:text="${u.nombres}"></b><span th:text="${u.username}"></span><small th:text="${u.role}"></small></div></div></div></div></main></body></html>
