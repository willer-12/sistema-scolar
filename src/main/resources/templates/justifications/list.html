<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Justificaciones')}">
</head>

<body>

    <!-- Barra superior -->
    <div th:replace="~{fragments/layout :: nav}">
    </div>

    <!-- Menú lateral -->
    <div th:replace="~{fragments/layout :: sidebar}">
    </div>

    <main class="content">

        <!-- =========================
             ENCABEZADO
             ========================= -->

        <div class="page-head">

            <div>

                <span class="eyebrow dark">
                    SEGUIMIENTO
                </span>

                <h1>
                    Justificaciones
                </h1>

                <p>
                    Registra el sustento de faltas o tardanzas.
                </p>

            </div>

        </div>


        <!-- =========================
             CONTENIDO PRINCIPAL
             ========================= -->

        <div class="grid-2">

            <!-- =========================
                 NUEVA JUSTIFICACIÓN
                 ========================= -->

            <div class="panel">

                <h3>
                    Nueva justificación
                </h3>

                <form
                    th:action="@{/justifications/save}"
                    method="post"
                    class="stack">

                    <!-- Registro de asistencia -->
                    <label>
                        Registro de asistencia

                        <select
                            name="asistenciaId"
                            required>

                            <option value="">
                                Selecciona…
                            </option>

                            <option
                                th:each="a : ${attendances}"
                                th:value="${a.id}"
                                th:text="${a.fecha + ' · ' + a.estudiante.fullName + ' · ' + a.estado}">
                            </option>

                        </select>

                    </label>


                    <!-- Motivo -->
                    <label>
                        Motivo

                        <textarea
                            name="motivo"
                            rows="4"
                            required
                            placeholder="Describe el motivo de la inasistencia o tardanza">
                        </textarea>

                    </label>


                    <!-- Documento -->
                    <label>
                        Documento / referencia

                        <input
                            name="documento"
                            placeholder="Opcional">

                    </label>


                    <!-- Guardar -->
                    <button
                        class="btn primary"
                        type="submit">

                        Guardar justificación

                    </button>

                </form>

            </div>


            <!-- =========================
                 JUSTIFICACIONES REGISTRADAS
                 ========================= -->

            <div class="panel">

                <h3>
                    Justificaciones registradas
                </h3>

                <div class="mini-list">

                    <!-- Lista de justificaciones -->
                    <div
                        class="mini-item"
                        th:each="j : ${items}">

                        <b
                            th:text="${j.asistencia.estudiante.fullName}">
                        </b>

                        <span
                            th:text="${j.asistencia.fecha + ' · ' + j.asistencia.estado}">
                        </span>

                        <small
                            th:text="${j.motivo}">
                        </small>

                    </div>


                    <!-- Mensaje cuando no existen registros -->
                    <p
                        class="muted"
                        th:if="${#lists.isEmpty(items)}">

                        Aún no hay justificaciones.

                    </p>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
